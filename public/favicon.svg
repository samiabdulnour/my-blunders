<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="my blunders">
  <!-- 2x2 board: sage on the diagonal, one light square, and a coral square
       with "??" — the chess blunder mark. Matches the app icon. The "??" uses
       a bold system font (browsers render favicon SVGs without web fonts). -->
  <rect x="0" y="0" width="16" height="16" fill="#86c69a" />
  <rect x="16" y="0" width="16" height="16" fill="#f2ede9" />
  <rect x="0" y="16" width="16" height="16" fill="#e8493f" />
  <rect x="16" y="16" width="16" height="16" fill="#86c69a" />
  <g transform="translate(8 24) scale(1 1.25)">
    <text x="0" y="0" fill="#f2ede9"
          font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700"
          font-size="14" letter-spacing="-2.5"
          text-anchor="middle" dominant-baseline="central">??</text>
  </g>
</svg>
