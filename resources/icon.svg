<!--
  App icon source, 1024×1024.

  A 2×2 chessboard quadrant: two sage squares on the diagonal, one light
  square, and a coral square carrying "??" — the chess symbol for a blunder,
  which is the whole point of the app. Colors are the app's own board/brand
  tokens (sq-d #8fae86, sq-l #f8f7f5, coral #f44e48).

  Apple enforces an opaque icon (no transparency; iOS applies the rounded-corner
  mask itself), and the four quadrants fill the canvas edge-to-edge, so it's
  fully opaque.

  NOTE: `resources/icon.png` is the authoritative master — it renders "??" in
  the app's Gruezi Bold typeface. This SVG is the editable source; a rasterizer
  without Gruezi installed will substitute a fallback for the "??" glyphs, so
  regenerate icon.png (see scripts) rather than rasterizing this directly when
  the exact type matters. `npx capacitor-assets generate --ios` uses icon.png.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <rect x="0" y="0" width="512" height="512" fill="#8fae86"/>
  <rect x="512" y="0" width="512" height="512" fill="#f8f7f5"/>
  <rect x="0" y="512" width="512" height="512" fill="#f44e48"/>
  <rect x="512" y="512" width="512" height="512" fill="#8fae86"/>
  <text x="256" y="768" fill="#f8f7f5"
        font-family="Gruezi, 'Helvetica Neue', Arial, sans-serif"
        font-weight="700" font-size="300" letter-spacing="-6"
        text-anchor="middle" dominant-baseline="central">??</text>
</svg>
